# Local hooks run the project's own pinned tools through uv, so versions match uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy src
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
