[project]
name = "gridiron-edge-worker"
version = "0.0.0"
description = "Python worker: NFL and Kalshi data in, priced recommendations out. A human places every trade."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ge = "ge.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "phase0: scaffold and guardrails",
    "phase1: data ingestion",
    "phase2: point-in-time store",
    "phase3: metric engine",
    "phase4: team ratings",
    "phase5: game simulation",
    "phase6: market pricing",
    "phase7: edge and decision layer",
    "phase8: backtest harness",
    "phase9: Base44 sync, scheduler, paper mode",
    "phase10: live operations",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["ge.edge.*", "ge.models.*", "ge.config"]
strict = true
