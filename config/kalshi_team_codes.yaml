# PRV-01 (spec rev 119, decision 2026-11-20): Kalshi's NFL team codes, used to split a
# prop ticker's game code (e.g. 26NOV22ARIKC -> ARI, KC) and read the player's team code from
# the player segment. A 2-or-3-letter rule is ambiguous on about 10% of 2026 tickers
# (LA|CKC vs LAC|KC), so the codes are listed. These are Kalshi's codes, not nflverse's;
# mapping them to nflverse is PRV-02's job (the nflverse block below).
# Codes are quoted: YAML reads a bare NO as false.
spec_id: PRV-01
status: initial
source: last segment of every KXNFLGAME ticker in data/raw/kalshi_markets/season=2026, partitions pulled_at=20260929T211431Z to pulled_at=20261120T020003Z (DATA-08, via ge ingest)
pulled_at: '2026-11-20T02:00:03+00:00'
codes: ['ARI', 'ATL', 'BAL', 'BUF', 'CAR', 'CHI', 'CIN', 'CLE', 'DAL', 'DEN', 'DET', 'GB', 'HOU', 'IND', 'JAC', 'KC', 'LAC', 'LAR', 'LV', 'MIA', 'MIN', 'NE', 'NO', 'NYG', 'NYJ', 'PHI', 'PIT', 'SEA', 'SF', 'TB', 'TEN', 'WAS']

# PRV-02 (spec rev 119, decision 2026-11-20): each Kalshi code's nflverse team abbreviation,
# derived by ge.pricer_v0.teams.derive_team_map from matching every 2026 KXNFLGAME event to the
# schedules game on the same date (ticker date = gameday, no time-zone shift) with the same two
# teams. tests/shadow/test_prv02_team_map.py re-derives it from the saved fixture
# tests/shadow/fixtures/kalshi_nflverse_games.json and fails the build on any difference.
