# PRJ-02 overtime formats (rulings 2026-10-23: B7 and the overtime rulings). One entry per
# season the simulator runs (2021-2024 and 2026) and game type. Source: the NFL's official
# rulebook page on operations.nfl.com, Rule 16 (Overtime Procedures). 2021-2024 were read from
# Internet Archive captures dated inside the season; 2026 from the live official page, rendered
# in a browser (the 2026 page loads Rule 16 with JavaScript, so its archived copy holds no rule
# text). Each entry keeps one verbatim quote under 15 words; everything else is the format in
# our own words (no further rulebook text is copied). Loaded strictly by
# ge.models.sim.overtime.load_overtime. A season with no entry raises.
#
# Format fields:
#   period_minutes: length of each overtime period
#   max_periods: 1 = a single period; null = periods continue until there is a winner
#   ties_allowed: whether a game still level after the last period ends tied
#   timeouts_per_team: timeouts each team gets; timeouts_reset_periods: they reset every N
#     periods (null = once for all of overtime)
#   opening_touchdown_ends_game: a touchdown on the first possession wins at once
#   opening_safety_ends_game: a safety by the kicking team on the receiving team's first
#     possession wins at once
#   After both teams have had their opportunity to possess, the team ahead wins; if level, the
#   next score of any kind wins (all entries below).

entries:
