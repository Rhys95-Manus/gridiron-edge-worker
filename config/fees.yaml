# EDG-02 Kalshi fees, from the table in docs/MODEL_SPEC.md.
# taker fee = ceil(M_t * taker_rate * C * P * (1 - P)); maker fee = ceil(M_m * maker_rate * C * P * (1 - P))
# Phase 1's `ge ingest fees-check` compares schedule_effective_date with the live PDF.
spec_id: EDG-02
status: initial
source_url: https://kalshi.com/docs/kalshi-fee-schedule.pdf  # MODEL_SPEC.md Sources section
schedule_effective_date: 2026-07-07
taker_rate: 0.07
maker_rate: 0.0175
# Decisions log 2026-09-27: round fees up to the cent until a real fill confirms the
# PDF's centicent formula text. Allowed: up_to_cent | up_to_centicent.
rounding: up_to_cent
# How Kalshi's API fee_type maps to the maker multiplier above, per
# https://docs.kalshi.com/api-reference/market/get-series.md: quadratic = the General Trading
# Fees Table (no maker fee); quadratic_with_maker_fees = maker fees apply (0.0175 = 0.25 x 0.07);
# quadratic_with_combo_maker_fees = "a 0.5 maker multiplier instead of 0.25". fee_multiplier is
# the taker multiplier. `flat` uses a different table and always alerts.
api_fee_types:
  quadratic: {maker_multiplier: 0}
  quadratic_with_maker_fees: {maker_multiplier: 1}
  quadratic_with_combo_maker_fees: {maker_multiplier: 2}
# Where these rows and Kalshi's API fee fields disagree, the costlier value is used and
# `ge ingest fees-check` alerts (EDG-02 and decisions log, 2026-09-29).
series:
  # Props and any series not listed below. Kalshi's API reports maker fees for KXNFLSPREAD,
  # KXNFLTOTAL, KXNFLANYTD, KXNFLFIRSTTD and KXNFL2TD; the API's costlier value applies.
  default: {taker_multiplier: 1, maker_multiplier: 0, tickers: []}
  # Game winner plus its sub-series (user approval 2026-09-29).
  KXNFLGAME:
    taker_multiplier: 1
    maker_multiplier: 1
    tickers: [KXNFLGAME, KXNFLGAMEFG, KXNFLGAMELOCATION, KXNFLGAMESACK, KXNFLGAMESPECIALS, KXNFLGAMETD, KXNFLGAMETO]
  # Combos, excluding uncorrelated NFL combos; the NFL combo series (user approval
  # 2026-09-29). EDG-02: whether the doubled maker rate applies is settled in Phase 7.
  KXMVE:
    taker_multiplier: 1
    maker_multiplier: 2
    tickers: [KXMVE, KXMVENFLSINGLEGAME, KXMVENFLMULTIGAME, KXMVENFLMULTIGAMEEXTENDED]
  # Division, conference, Super Bowl and awards series: the fee schedule PDF's NFL tickers
  # except KXNFLGAME, which has its own row (user approval 2026-09-29).
  futures_and_awards:
    taker_multiplier: 1
    maker_multiplier: 1
    # KXNFLMVPSPECIALS added by user decision 2026-09-29 (not in the PDF).
    tickers: [KXNFLAFCCHAMP, KXNFLAFCEAST, KXNFLAFCNORTH, KXNFLAFCSOUTH, KXNFLAFCWEST, KXNFLNFCCHAMP, KXNFLNFCEAST, KXNFLNFCNORTH, KXNFLNFCSOUTH, KXNFLNFCWEST, KXNFLMVP, KXNFLMVPSPECIALS, KXNFLOPOTY, KXNFLDPOTY, KXNFLOROTY, KXNFLDROTY, KXNFLCOTY, KXNFLCPOTY, KXSB]

# Known disagreements between the rows above and Kalshi's API fee fields, reviewed by the
# user. fees-check passes only when every disagreement matches one of these exactly; any new,
# changed or resolved one fails. The costlier value (value_in_use) applies regardless.
acknowledged:
  - {ticker: KXMVENFLSINGLEGAME, field: maker, fees_yaml_value: 2, api_value: 0, api_fee_type: quadratic, value_in_use: 2, reason: 'EDG-02 combos row doubles the maker rate; API lists no maker fee; settled in Phase 7 from a real fill', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXMVENFLMULTIGAME, field: maker, fees_yaml_value: 2, api_value: 0, api_fee_type: quadratic, value_in_use: 2, reason: 'EDG-02 combos row doubles the maker rate; API lists no maker fee; settled in Phase 7 from a real fill', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXMVENFLMULTIGAMEEXTENDED, field: maker, fees_yaml_value: 2, api_value: 0, api_fee_type: quadratic, value_in_use: 2, reason: 'EDG-02 combos row doubles the maker rate; API lists no maker fee; settled in Phase 7 from a real fill', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLSPREAD, field: maker, fees_yaml_value: 0, api_value: 1, api_fee_type: quadratic_with_maker_fees, value_in_use: 1, reason: 'API reports maker fees the PDF does not list (EDG-02 default row note)', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLTOTAL, field: maker, fees_yaml_value: 0, api_value: 1, api_fee_type: quadratic_with_maker_fees, value_in_use: 1, reason: 'API reports maker fees the PDF does not list (EDG-02 default row note)', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLANYTD, field: maker, fees_yaml_value: 0, api_value: 1, api_fee_type: quadratic_with_maker_fees, value_in_use: 1, reason: 'API reports maker fees the PDF does not list (EDG-02 default row note)', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLFIRSTTD, field: maker, fees_yaml_value: 0, api_value: 1, api_fee_type: quadratic_with_maker_fees, value_in_use: 1, reason: 'API reports maker fees the PDF does not list (EDG-02 default row note)', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFL2TD, field: maker, fees_yaml_value: 0, api_value: 1, api_fee_type: quadratic_with_maker_fees, value_in_use: 1, reason: 'API reports maker fees the PDF does not list (EDG-02 default row note)', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMEFG, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMELOCATION, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMESACK, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMESPECIALS, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMETD, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLGAMETO, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'sub-series placed in the game row by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-29'}
  - {ticker: KXNFLMVPSPECIALS, field: maker, fees_yaml_value: 1, api_value: 0, api_fee_type: quadratic, value_in_use: 1, reason: 'placed in futures_and_awards by user decision; API lists no maker fee', acknowledged_by: user, acknowledged_on: '2026-09-30'}
